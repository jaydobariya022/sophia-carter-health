<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | MD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Roboto:wght@400;500;700&family=Oxygen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/md/css/style.css">
</head>
<body>

    <main class="legal-main">
        <h1 class="legal-title">Contact Us</h1>
        <p class="legal-text">Please fill in the form below and we'll get back to you as soon as possible.</p>
        
        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-input" required placeholder="Your full name">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="Your email address">
            </div>

            <div class="form-group">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" class="form-textarea" required placeholder="How can we help you?"></textarea>
            </div>

            <button type="submit" class="form-submit-btn">Submit</button>
        </form>

        <a href="/md/" class="legal-back-home">&larr; Back to Home</a>
    </main>

</body>
</html>
